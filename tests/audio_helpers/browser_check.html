<!doctype html>
<!--
  tests/audio_helpers/browser_check.html - OWNER: AUDIO   STATUS: IMPLEMENTED (manual / scripted browser smoke test, not part of npm test)
  Serve the project root (python -m http.server 8765 --bind 127.0.0.1) and open
    http://127.0.0.1:8765/tests/audio_helpers/browser_check.html   then click "Run".
  It exercises the REAL browser APIs behind src/audio.js (AudioContext, decodeAudioData, OscillatorNode scheduling, IndexedDB,
  DecompressionStream, DataTransfer, File) with SYNTHETIC sounds generated here (tones + a tiny MIDI). It never contacts the Internet and
  uses no game assets: the manifest handed to createAudio is a synthetic one, so every SHA-1 is computed from the generated bytes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>audio browser check</title>
<style>body{font:14px/1.4 monospace;background:#111;color:#ddd;margin:16px}button{font:inherit;padding:6px 14px}.fail{color:#f66}.pass{color:#6c6}</style>
</head>
<body>
<button id="go">Run audio check (click = user gesture)</button>
<pre id="out"></pre>
<script type="module">
import { createAudio } from '../../src/audio.js';
import { createCache } from '../../src/audio/cache.js';
import { sha1Hex } from '../../src/audio/validate.js';
import { readZip, inflateRawJs } from '../../src/audio/zip.js';
import { pickSoundFiles } from '../../src/audio/userfiles.js';
import * as real from '../../src/data/sounds.js';

const out = document.getElementById('out');
const results = [];
window.__results = results;
const log = (cls, name, detail = '') => {
  results.push({ ok: cls === 'pass', name, detail });
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = `${cls.toUpperCase()}  ${name}  ${detail}`;
  out.appendChild(line);
};
const check = (name, cond, detail = '') => log(cond ? 'pass' : 'fail', name, detail);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---- record every exception thrown by the WebAudio calls (the synth swallows them on purpose) ---------------------------------
const apiErrors = [];
function wrap(proto, names) {
  for (const n of names) {
    const orig = proto[n];
    if (typeof orig !== 'function') continue;
    proto[n] = function (...args) {
      try { return orig.apply(this, args); } catch (e) { apiErrors.push(`${n}(${args.map((a) => (typeof a === 'number' ? +a.toFixed(3) : typeof a)).join(',')}): ${e.name}: ${e.message}`); throw e; }
    };
  }
}
wrap(AudioParam.prototype, ['setValueAtTime', 'linearRampToValueAtTime', 'exponentialRampToValueAtTime', 'setTargetAtTime']);
wrap(AudioScheduledSourceNode.prototype, ['start', 'stop']);
wrap(AudioNode.prototype, ['connect', 'disconnect']);
wrap(BaseAudioContext.prototype, ['createGain', 'createOscillator', 'createBufferSource', 'createBiquadFilter', 'createBuffer', 'decodeAudioData']);

// ---- synthetic assets ---------------------------------------------------------------------------------------------------------------
function makeWav(freq, seconds, rate = 11025) {
  const n = Math.floor(rate * seconds);
  const u = new Uint8Array(44 + n);
  const dv = new DataView(u.buffer);
  const tag = (o, s) => { for (let i = 0; i < 4; i++) u[o + i] = s.charCodeAt(i); };
  tag(0, 'RIFF'); dv.setUint32(4, 36 + n, true); tag(8, 'WAVE'); tag(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, rate, true); dv.setUint32(28, rate, true);
  dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); tag(36, 'data'); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) u[44 + i] = 128 + Math.round(100 * Math.sin((2 * Math.PI * freq * i) / rate) * (1 - i / n));
  return u;
}
const vlq = (n) => { const o = [n & 127]; while ((n >>= 7) > 0) o.unshift((n & 127) | 128); return o; };
function makeMidi() {
  const ev = [[0, 0xff, 0x51, 3, 0x07, 0xa1, 0x20], [0, 0xc0, 0], [0, 0xc1, 38], [0, 0xc2, 80]];
  const arp = [60, 64, 67, 72, 67, 64, 60, 55];
  arp.forEach((n, i) => { ev.push([i === 0 ? 0 : 0, 0x90, n, 100], [240, 0x80, n, 0]); });
  ev.push([0, 0x91, 36, 110], [480, 0x81, 36, 0], [0, 0x91, 43, 100], [480, 0x81, 43, 0]);
  ev.push([0, 0x92, 76, 80], [960, 0x82, 76, 0]);
  for (let i = 0; i < 8; i++) ev.push([i === 0 ? 0 : 240, 0x99, i % 4 === 0 ? 36 : i % 2 ? 42 : 38, 100], [0, 0x99, 46, 60]);
  ev.push([240, 0xff, 0x2f, 0]);
  const body = ev.flatMap(([d, ...b]) => [...vlq(d), ...b]);
  const be32 = (n) => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  return Uint8Array.from([0x4d, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 0, 0, 1, 1, 0xe0, 0x4d, 0x54, 0x72, 0x6b, ...be32(body.length), ...body]);
}
async function manifest() {
  const specs = [['SOUND1', 440, 0.3], ['SOUND3', 660, 0.25], ['SOUND4', 330, 0.4], ['SOUND5', 880, 0.15], ['SOUND49D', 550, 0.2]];
  const SOUND_FILES = {};
  const blobs = new Map();
  for (const [key, f, s] of specs) {
    const u = makeWav(f, s);
    blobs.set(key + '.WAV', u);
    SOUND_FILES[key] = { bytes: u.length, sha1: await sha1Hex(u), timer: u.length / 11000 };
  }
  const mid = makeMidi();
  blobs.set('PINBALL.MID', mid);
  const MUSIC_FILE = { name: 'PINBALL.MID', bytes: mid.length, sha1: await sha1Hex(mid) };
  const SOUND_KEYS = { FLIP_UP: { file: 'SOUND1' }, FLIP_DOWN: { file: 'SOUND3' }, BALL_FEED: { file: 'SOUND4' }, BUMPER: { file: 'SOUND5' }, SW49D: { file: 'SOUND49D' }, GAME_OVER: { file: null } };
  const soundDuration = (k) => (SOUND_KEYS[k] && SOUND_KEYS[k].file ? SOUND_FILES[SOUND_KEYS[k].file].timer : -1);
  return { data: { ...real, SOUND_FILES, MUSIC_FILE, SOUND_KEYS, soundDuration }, blobs, specs };
}
const baseOf = (url) => decodeURIComponent(url).split('/').pop().toUpperCase();

// ---- AudioContext with a tap so we can measure what is actually being produced ---------------------------------------------------
let tap = null;
class TapCtx extends AudioContext {
  constructor(o) {
    super(o);
    const an = this.createAnalyser();
    an.fftSize = 2048;
    an.connect(super.destination);
    Object.defineProperty(this, 'destination', { value: an, configurable: true });
    tap = an;
    window.__ctx = this;
  }
}
const buf = new Float32Array(2048);
function peak() { tap.getFloatTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v)); return m; }
async function maxPeakOver(ms) { let m = 0; const t0 = performance.now(); while (performance.now() - t0 < ms) { m = Math.max(m, peak()); await sleep(15); } return m; }

// ---- zip writer (stored + deflate-raw through CompressionStream) -----------------------------------------------------------------
async function deflateRaw(u8) {
  const cs = new CompressionStream('deflate-raw');
  const w = cs.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u) => { let c = 0xffffffff; for (const b of u) c = crcTable[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
async function makeZip(entries) {
  const le16 = (n) => [n & 255, (n >>> 8) & 255];
  const le32 = (n) => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const parts = []; const central = []; let off = 0;
  for (const [name, data, method] of entries) {
    const comp = method === 8 ? await deflateRaw(data) : data;
    const nb = [...new TextEncoder().encode(name)];
    const local = [0x50, 0x4b, 3, 4, ...le16(20), ...le16(0), ...le16(method), ...le16(0), ...le16(0x21), ...le32(crc32(data)), ...le32(comp.length), ...le32(data.length), ...le16(nb.length), ...le16(0), ...nb];
    parts.push(Uint8Array.from(local), comp);
    central.push(Uint8Array.from([0x50, 0x4b, 1, 2, ...le16(20), ...le16(20), ...le16(0), ...le16(method), ...le16(0), ...le16(0x21), ...le32(crc32(data)), ...le32(comp.length), ...le32(data.length), ...le16(nb.length), ...le16(0), ...le16(0), ...le16(0), ...le16(0), ...le32(0), ...le32(off), ...nb]));
    off += local.length + comp.length;
  }
  let cdSize = 0; for (const c of central) { parts.push(c); cdSize += c.length; }
  parts.push(Uint8Array.from([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...le16(entries.length), ...le16(entries.length), ...le32(cdSize), ...le32(off), 0, 0]));
  return new Uint8Array(await new Blob(parts).arrayBuffer());
}

async function run() {
  const { data, blobs, specs } = await manifest();
  const names = specs.map(([k]) => k + '.WAV');
  const served = (url) => (url.startsWith('./sounds/') && blobs.has(baseOf(url)) ? blobs.get(baseOf(url)) : null);
  const fakeFetch = async (url) => {
    const body = served(url);
    if (!body) return { ok: false, status: 404, arrayBuffer: async () => new ArrayBuffer(0) };
    return { ok: true, status: 200, arrayBuffer: async () => body.buffer.slice(body.byteOffset, body.byteOffset + body.byteLength) };
  };
  const dbName = 'audio-browser-check-tmp';
  indexedDB.deleteDatabase(dbName);
  const cache = createCache({ dbName });
  const audio = createAudio({ fetch: fakeFetch, AudioContext: TapCtx, data, cache, sleep: async () => {}, log: (...a) => console.info(...a) });

  // 1. unlock inside the click, decode, status
  const p = audio.unlock();
  check('AudioContext created synchronously in the gesture', !!window.__ctx);
  await p;
  check('AudioContext is running after unlock()', window.__ctx.state === 'running', window.__ctx.state);
  const st = await audio.load();
  check('load() from ./sounds (synthetic, SHA-1 validated)', st.state === 'ready' && st.loaded === 5 && st.source === 'local', JSON.stringify(st));
  check('status text', st.text === 'sound: original (local)', st.text);

  // 2. real playback is audible on the tap; durations are the manifest ones regardless of the decoded buffer
  check('play() returns the manifest duration', Math.abs(audio.play('FLIP_UP') - data.SOUND_FILES.SOUND1.timer) < 1e-9);
  const pk = await maxPeakOver(150);
  check('FLIP_UP is audible on the output tap', pk > 0.02, 'peak ' + pk.toFixed(3));
  check('missing-file key stays silent and returns -1', audio.play('GAME_OVER') === -1);
  for (let i = 0; i < 20; i++) audio.play(['FLIP_UP', 'FLIP_DOWN', 'BALL_FEED', 'BUMPER', 'SW49D'][i % 5]);
  await sleep(50);
  audio.update(0.016);
  check('20 rapid plays did not throw', apiErrors.length === 0, apiErrors.join(' | '));

  // 3. master volume and the effects mute act on the real graph
  audio.setVolume(0);
  audio.play('BALL_FEED');
  await sleep(100); // the analyser keeps ~43 ms of history: let the audio rendered before the change leave its window
  const quiet = await maxPeakOver(120);
  check('volume 0 is silent', quiet < 0.002, 'peak ' + quiet.toFixed(4));
  audio.setVolume(1);
  audio.setEnabled(false);
  audio.play('BALL_FEED');
  await sleep(100);
  const muted = await maxPeakOver(120);
  check('Sounds off is silent', muted < 0.002, 'peak ' + muted.toFixed(4));
  audio.setEnabled(true);

  // 4. cache: a second instance with a dead network is served from IndexedDB
  const dead = async () => { throw new Error('offline'); };
  const audio2 = createAudio({ fetch: dead, AudioContext: TapCtx, data, cache: createCache({ dbName }), sleep: async () => {} });
  const st2 = await audio2.load();
  check('IndexedDB cache serves a reload without network', st2.state === 'ready' && st2.source === 'local', JSON.stringify(st2));
  audio2.dispose();

  // 5. music: the built-in synth plays the synthetic MIDI audibly with no WebAudio exceptions
  await audio.music.setEnabled(true);
  check('music: loaded from ./sounds and parsed', audio.music.available());
  const mp = await maxPeakOver(1800);
  check('music is audible on the output tap', mp > 0.005, 'peak ' + mp.toFixed(3));
  check('music scheduling raised no WebAudio exceptions', apiErrors.length === 0, apiErrors.slice(0, 5).join(' | '));
  audio.setPaused(true);
  await sleep(150);
  check('pause suspends the context', window.__ctx.state === 'suspended', window.__ctx.state);
  audio.setPaused(false);
  await sleep(250);
  check('resume restarts the context', window.__ctx.state === 'running', window.__ctx.state);
  const mp2 = await maxPeakOver(1500);
  check('music audible again after resume', mp2 > 0.005, 'peak ' + mp2.toFixed(3));
  await audio.music.setEnabled(false);
  await sleep(700);
  const after = await maxPeakOver(150);
  check('music off is silent (release tails over)', after < 0.01, 'peak ' + after.toFixed(4));
  check('no WebAudio exceptions at the end', apiErrors.length === 0, apiErrors.slice(0, 5).join(' | '));

  // 6. user files: real File objects, a real DataTransfer drop (programmatic: falls back to getAsFile), zip through DecompressionStream
  const audio3 = createAudio({ AudioContext: TapCtx, data, cache: false });
  const files = names.map((n) => new File([blobs.get(n)], n));
  const dt = new DataTransfer();
  for (const f of files.slice(0, 3)) dt.items.add(f);
  let done = null;
  const detach = audio3.attachDropTarget(document.body, (s) => { done = s; });
  document.body.dispatchEvent(new DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true }));
  for (let i = 0; i < 100 && !done; i++) await sleep(20);
  detach();
  check('drag-and-drop of real File objects', done && done.loaded === 3 && done.source === 'user', JSON.stringify(done));
  const zip = await makeZip([['Pinball/SOUND4.WAV', blobs.get('SOUND4.WAV'), 8], ['Pinball/SOUND5.WAV', blobs.get('SOUND5.WAV'), 0], ['Pinball/SOUND49D.WAV', blobs.get('SOUND49D.WAV'), 8], ['Pinball/PINBALL.DAT', new Uint8Array(50000), 8]]);
  const st3 = await audio3.loadFromFiles([new File([zip], 'Pinball.zip')]);
  check('zip import (native DecompressionStream deflate-raw)', st3.loaded === 5 && st3.state === 'ready', JSON.stringify(st3));
  const rz = await readZip(zip);
  const rzJs = await readZip(zip, { native: false });
  const same = (a, b) => a.byteLength === b.byteLength && new Uint8Array(a).every((v, i) => v === new Uint8Array(b)[i]);
  check('readZip native and built-in inflate agree', [...rz.keys()].length === 4 && [...rz.keys()].every((k) => same(rz.get(k), rzJs.get(k))));
  const rnd = new Uint8Array(70000); let s = 12345; for (let i = 0; i < rnd.length; i++) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; rnd[i] = (s >>> 16) & (i % 5 ? 15 : 255); }
  const comp = await deflateRaw(rnd);
  check('inflateRawJs matches CompressionStream output', same(inflateRawJs(comp, rnd.length + 1).buffer.slice(0, rnd.length), rnd.buffer));
  const picked = await pickSoundFiles([new File([zip], 'x.zip')]);
  check('pickSoundFiles on a real zip File', [...picked.keys()].sort().join() === 'SOUND4,SOUND49D,SOUND5', [...picked.keys()].join());

  indexedDB.deleteDatabase(dbName);
  const failed = results.filter((r) => !r.ok).length;
  const sum = document.createElement('div');
  sum.className = failed ? 'fail' : 'pass';
  sum.textContent = failed ? `${failed} check(s) FAILED` : `ALL ${results.length} CHECKS PASSED`;
  out.appendChild(sum);
  window.__done = true;
  window.__failed = failed;
}
document.getElementById('go').addEventListener('click', () => { run().catch((e) => { log('fail', 'harness crashed', String(e && e.stack || e)); window.__done = true; window.__failed = 1; }); });
</script>
</body>
</html>
